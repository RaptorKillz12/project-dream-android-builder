name: Build Godot Project Dream Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-android.yml'
    branches: [ main ]

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o "$HOME/godot/godot.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot/bin"
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz \
            -o "$HOME/godot/templates.tpz"
          unzip -q "$HOME/godot/templates.tpz" -d "$HOME/godot/templates"
          find "$HOME/godot/templates" -type f -name 'android*' -exec cp {} "$HOME/.local/share/godot/export_templates/4.7.2.stable/" \;
          chmod +x "$HOME/godot/bin/Godot_v4.7.2-stable_linux.x86_64"

      - name: Import and validate project
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$HOME/godot/bin/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --editor --path godot --quit

      - name: Export Android ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$HOME/godot/bin/Godot_v4.7.2-stable_linux.x86_64" \
            --headless --path godot --export-debug Android build/ProjectDreamSetup.apk
          test -s build/ProjectDreamSetup.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Project-Dream-Godot-Android-ARM64
          path: build/ProjectDreamSetup.apk
          if-no-files-found: error
